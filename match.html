    <div class="sim-block">
      <div class="sim-block-title">Posesie medie · simulare</div>
      <div style="display:flex;align-items:center;gap:10px;padding:6px 0">
        <div style="display:flex;flex-direction:column;align-items:flex-end;min-width:80px;gap:2px">
          <span style="font-size:11px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:80px">${homeName}</span>
          <span style="font-family:'DM Mono',monospace;font-size:18px;font-weight:700;color:var(--accent)">${r.homeAvgPosSimPct.toFixed(1)}%</span>
        </div>
        <div style="flex:1;height:12px;background:var(--border);border-radius:6px;overflow:hidden;display:flex">
          <div style="height:100%;width:${r.homeAvgPosSimPct.toFixed(1)}%;background:var(--accent);transition:width 0.3s"></div>
          <div style="height:100%;flex:1;background:var(--accent2)"></div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-start;min-width:80px;gap:2px">
          <span style="font-size:11px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:80px">${awayName}</span>
          <span style="font-family:'DM Mono',monospace;font-size:18px;font-weight:700;color:var(--accent2)">${(100 - r.homeAvgPosSimPct).toFixed(1)}%</span>
        </div>
      </div>
    </div>

    ${(r.homeAvgFoulsSim > 0 || r.awayAvgFoulsSim > 0 || r.homeAvgYellowsSim > 0 || r.awayAvgYellowsSim > 0) ? `
    <div class="sim-block">
      <div class="sim-block-title">Faulturi & Cartonașe Galbene · medie per meci · simulare</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:4px 0">
        ${[
          { label: 'Faulturi comise', home: r.homeAvgFoulsSim, away: r.awayAvgFoulsSim },
          { label: 'Cartonașe galbene', home: r.homeAvgYellowsSim, away: r.awayAvgYellowsSim },
        ].map(({ label, home, away }) => {
          const maxVal = Math.max(home, away, 0.1);
          return `<div style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 12px">
            <div style="font-family:'DM Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:0.5px;color:var(--muted);margin-bottom:8px">${label}</div>
            <div style="display:flex;flex-direction:column;gap:6px">
              <div style="display:flex;align-items:center;gap:8px">
                <span style="font-size:11px;font-weight:600;color:var(--text);min-width:90px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${homeName}</span>
                <div style="flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden">
                  <div style="height:100%;width:${(home/maxVal*100).toFixed(0)}%;background:var(--accent);border-radius:3px"></div>
                </div>
                <span style="font-family:'DM Mono',monospace;font-size:13px;font-weight:700;color:var(--accent);min-width:28px;text-align:right">${home.toFixed(1)}</span>
              </div>
              <div style="display:flex;align-items:center;gap:8px">
                <span style="font-size:11px;font-weight:600;color:var(--text);min-width:90px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${awayName}</span>
                <div style="flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden">
                  <div style="height:100%;width:${(away/maxVal*100).toFixed(0)}%;background:var(--accent2);border-radius:3px"></div>
                </div>
                <span style="font-family:'DM Mono',monospace;font-size:13px;font-weight:700;color:var(--accent2);min-width:28px;text-align:right">${away.toFixed(1)}</span>
              </div>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>` : ''}

    ${(() => {
      const intervals = ["0-15'", "16-30'", "31-45'", "46-60'", "61-75'", "76-90'"];

      // Extrage procentele per interval dintr-un array de perioade
      function toPercents(periods, key) {
        if (!periods || periods.length === 0) return null;
        const total = periods.reduce((s, p) => s + (p[key] || 0), 0);
        if (total === 0) return null;
        return periods.map(p => (p[key] || 0) / total * 100);
      }


      const homePeriods = homeGoalDist?.goalDistributions?.find(d => d.type === 'home')?.periods;
      const awayPeriods = awayGoalDist?.goalDistributions?.find(d => d.type === 'away')?.periods;

      const homeScored   = toPercents(homePeriods, 'scoredGoals');
      const homeConceded = toPercents(homePeriods, 'concededGoals');
      const awayScored   = toPercents(awayPeriods, 'scoredGoals');
      const awayConceded = toPercents(awayPeriods, 'concededGoals');

      // Suprapunere: normalizeaza weights la suma 100%
      // Suprapunere = produsul celor 2 distributii independente per directie (normalizat la %)
      function overlapPercents(wA, wB) {
        if (!wA || !wB) return null;
        const raw = wA.map((v, i) => v * wB[i]);
        const total = raw.reduce((s, v) => s + v, 0);
        return total > 0 ? raw.map(v => v / total * 100) : null;
      }
      const homeOverlap = overlapPercents(homeScoredW, awayConcededW);
      const awayOverlap = overlapPercents(awayScoredW, homeConcededW);

      const maxHome = homeOverlap ? Math.max(...homeOverlap) : 1;
      const maxAway = awayOverlap ? Math.max(...awayOverlap) : 1;

      return `
        <div class="sim-block">
          <div class="sim-block-title">Când se marchează · distribuție goluri per interval</div>
          ${(!homeOverlap && !awayOverlap)
            ? `<div class="goal-dist-na">Date indisponibile</div>`
            : `
          <div class="gdist-legend">
            <div class="gdist-legend-item">
              <span class="gdist-legend-dot home"></span>
              <span>${homeName}</span>
            </div>
            <div class="gdist-legend-item">
              <span class="gdist-legend-dot away"></span>
              <span>${awayName}</span>
            </div>
          </div>
          ${intervals.map((label, i) => {
            const hPct  = homeOverlap ? Math.round(homeOverlap[i]) : null;
            const aPct  = awayOverlap ? Math.round(awayOverlap[i]) : null;
            const hBarW = homeOverlap ? Math.round(homeOverlap[i] / maxHome * 100) : 0;
            const aBarW = awayOverlap ? Math.round(awayOverlap[i] / maxAway * 100) : 0;
            const isPeakH = homeOverlap && homeOverlap[i] === maxHome;
            const isPeakA = awayOverlap && awayOverlap[i] === maxAway;
            return `<div class="gdist-interval-row">
              <span class="gdist-label">${label}</span>
              <div class="gdist-bars">
                ${hPct !== null ? `<div class="gdist-bar-wrap">
                  <div class="gdist-bar-track"><div class="gdist-bar-fill-home ${isPeakH ? 'gdist-peak' : ''}" style="width:${hBarW}%"></div></div>
                  <span class="gdist-bar-pct ${isPeakH ? 'gdist-peak' : ''}">${hPct}%</span>
                </div>` : ''}
                ${aPct !== null ? `<div class="gdist-bar-wrap">
                  <div class="gdist-bar-track"><div class="gdist-bar-fill-away ${isPeakA ? 'gdist-peak' : ''}" style="width:${aBarW}%"></div></div>
                  <span class="gdist-bar-pct ${isPeakA ? 'gdist-peak' : ''}">${aPct}%</span>
                </div>` : ''}
              </div>
            </div>`;
          }).join('')}
          `}
        </div>`;
    })()}`;
      }

      let simLoaded = false;
      let currentLineupData = undefined;
      let resolveLineupLoad;
      const lineupLoadPromise = new Promise(r => { resolveLineupLoad = r; });

      async function loadSimulation() {
        if (simLoaded || !event) return;
        simLoaded = true;

        const tournamentId = event.tournament?.uniqueTournament?.id;
        const seasonId = event.season?.id;
        const homeTeamId = event.homeTeam?.id;
        const awayTeamId = event.awayTeam?.id;
        const currentTs = event.startTimestamp;
        const homeLogoUrl = `https://api.sofascore.app/api/v1/team/${homeTeamId}/image`;
        const awayLogoUrl = `https://api.sofascore.app/api/v1/team/${awayTeamId}/image`;

        document.getElementById("simVerifySection").innerHTML =
          `<div id="simResultsSection" class="sim-results-section"><div class="sim-results-loading"><div class="spinner"></div><span>Se încarcă datele...</span></div></div>`;

        let [homeEvents, awayEvents, standingsRows, standingsHome, standingsAway, h2hMatches] = await Promise.all([
          fetchLastMatches(homeTeamId),
          fetchLastMatches(awayTeamId),
          fetchStandings(tournamentId, seasonId, 'total'),
          fetchStandings(tournamentId, seasonId, 'home'),
          fetchStandings(tournamentId, seasonId, 'away'),
          fetchH2H(event.id, event.customId, currentTs),
        ]);

        // Fallback la sezonul anterior dacă sezonul curent are < 7 meciuri/echipă în medie
        const MIN_MATCHES = 7;
        const avgMatches = standingsRows.length
          ? standingsRows.reduce((s, r) => s + (r.matches ?? 0), 0) / standingsRows.length
          : 0;
        let standingsSeasonLabel = event.season?.name ?? 'Sezon curent';
        let standingsSeasonFallback = false;
        if (avgMatches < MIN_MATCHES) {
          const seasons = await fetchSeasons(tournamentId);
          const currentIdx = seasons.findIndex(s => s.id === seasonId);
          const prevSeason = seasons[currentIdx + 1]; // seasons sunt ordonate descrescător
          if (prevSeason) {
            const [prevTotal, prevHome, prevAway] = await Promise.all([
              fetchStandings(tournamentId, prevSeason.id, 'total'),
              fetchStandings(tournamentId, prevSeason.id, 'home'),
              fetchStandings(tournamentId, prevSeason.id, 'away'),
            ]);
            if (prevTotal.length) {
              standingsRows         = prevTotal;
              standingsHome         = prevHome;
              standingsAway         = prevAway;
              standingsSeasonLabel  = prevSeason.name ?? 'Sezon anterior';
              standingsSeasonFallback = true;
            }
          }
        }

        const h2hStats = await Promise.all(h2hMatches.map(e => fetchEventStatistics(e.id)));

        const [homeGoalDist, awayGoalDist] = await Promise.all([
          fetchGoalDistributions(homeTeamId, tournamentId, seasonId),
          fetchGoalDistributions(awayTeamId, tournamentId, seasonId),
        ]);
        const { homeScoredW, homeConcededW, awayScoredW, awayConcededW } = calcGoalDistWeights(homeGoalDist, awayGoalDist);

        function extractLineupIds(lineupSide) {
          if (!lineupSide?.players) return { starters: new Set(), subs: new Set() };
          return {
            starters: new Set(lineupSide.players.filter(p => !p.substitute).map(p => p.player?.id).filter(Boolean)),
            subs:     new Set(lineupSide.players.filter(p =>  p.substitute).map(p => p.player?.id).filter(Boolean)),
          };
        }

        const currentHomeLineup = extractLineupIds(currentLineupData?.home);
        const currentAwayLineup = extractLineupIds(currentLineupData?.away);
        // Set cu toti jucatorii (titulari + rezerve) — folosit pentru calcCombinedSim si verificari .size
        const currentHomeIds = new Set([...currentHomeLineup.starters, ...currentHomeLineup.subs]);
        const currentAwayIds = new Set([...currentAwayLineup.starters, ...currentAwayLineup.subs]);

        const homeFiltered = homeEvents
          .filter(
            (e) =>
              (e.homeTeam?.id === homeTeamId || e.awayTeam?.id === homeTeamId) &&
              e.tournament?.uniqueTournament?.id === tournamentId &&
              e.status?.type === "finished" &&
              e.startTimestamp < currentTs,
          )
          .sort((a, b) => b.startTimestamp - a.startTimestamp)
          .slice(0, 6);

        const awayFiltered = awayEvents
          .filter(
            (e) =>
              (e.homeTeam?.id === awayTeamId || e.awayTeam?.id === awayTeamId) &&
              e.tournament?.uniqueTournament?.id === tournamentId &&
              e.status?.type === "finished" &&
              e.startTimestamp < currentTs,
          )
          .sort((a, b) => b.startTimestamp - a.startTimestamp)
          .slice(0, 6);

        // PPG map + maxDiff universal per campionat
        const ppgMap = buildPPGMap(standingsRows);

        // Completăm ppgMap cu echipe lipsă (faze playoff, baraj etc.)
        // calculând PPG direct din evenimentele disponibile
        const allTournamentEvents = [...homeEvents, ...awayEvents].filter(
          e => e.tournament?.uniqueTournament?.id === tournamentId && e.status?.type === 'finished'
        );
        const eventPPGData = {};
        for (const e of allTournamentEvents) {
          const pairs = [
            [e.homeTeam, e.homeScore?.display ?? 0, e.awayScore?.display ?? 0],
            [e.awayTeam, e.awayScore?.display ?? 0, e.homeScore?.display ?? 0],
          ];
          for (const [team, gs, gc] of pairs) {
            if (!team?.id || ppgMap[team.id] != null) continue;
            if (!eventPPGData[team.id]) eventPPGData[team.id] = { pts: 0, m: 0 };
            eventPPGData[team.id].pts += gs > gc ? 3 : gs === gc ? 1 : 0;
            eventPPGData[team.id].m++;
          }
        }
        for (const [id, { pts, m }] of Object.entries(eventPPGData)) {
          if (m > 0) ppgMap[id] = pts / m;
        }

        const ppgValues = Object.values(ppgMap);
        const maxDiff = ppgValues.length
          ? Math.max(...ppgValues) - Math.min(...ppgValues)
          : 0;
        const ppgActualOppHome = ppgMap[event.awayTeam?.id];
        const ppgActualOppAway = ppgMap[event.homeTeam?.id];

        // Fetch statistici pentru toate cele 10 meciuri secvențial
        // side și pastOpp se determină dinamic (poate fi acasă sau deplasare)
        function calcLineupSim(currentLineup, pastLineup, side) {
          const { starters: currStarters, subs: currSubs } = currentLineup;
          if (currStarters.size === 0) return null;
          const pastSide = side === "home" ? pastLineup?.home : pastLineup?.away;
          const { starters: pastStarters, subs: pastSubs } = extractLineupIds(pastSide);
          const pastAll = new Set([...pastStarters, ...pastSubs]);
          if (pastAll.size === 0) return null;
          // Titulari curent vs toti jucatorii din meciul trecut
          let matchedStarters = 0;
          for (const id of currStarters) if (pastAll.has(id)) matchedStarters++;
          // Rezerve curent vs toti jucatorii din meciul trecut
          let matchedSubs = 0;
          for (const id of currSubs) if (pastAll.has(id)) matchedSubs++;
          // Scor ponderat: 70% titulari, 30% rezerve
          const starterScore = currStarters.size > 0 ? matchedStarters / currStarters.size : 0;
          const subScore     = currSubs.size     > 0 ? matchedSubs     / currSubs.size     : 0;
          const pct = Math.round((starterScore * 0.70 + subScore * 0.30) * 100);
          return {
            pct,
            common: matchedStarters + matchedSubs,
            total:  currStarters.size + currSubs.size,
            pastIds: pastAll,
          };
        }

        const allMatches = homeFiltered.length + awayFiltered.length;
        let matchIdx = 0;
        const setLoadMsg = (teamName, isCached) => {
          matchIdx++;
          const src = isCached
            ? `<span style="color:var(--win)">(cache)</span>`
            : `<span style="color:var(--accent)">(fetch)</span>`;
          document.getElementById("simResultsSection").innerHTML =
            `<div class="sim-results-loading"><div class="spinner"></div><span>Se încarcă datele... ${matchIdx}/${allMatches} ${src}<br><small style="color:var(--muted)">${teamName}</small></span></div>`;
        };

        const homeData = [];
        for (const e of homeFiltered) {
          const isHome = e.homeTeam?.id === homeTeamId;
          const side = isHome ? "home" : "away";
          const statsCached = await cacheGet(`stats_${e.id}`);
          const lineupCached = await cacheGet(`lineups_${e.id}`);
          const isCached = !!(statsCached && lineupCached);
          setLoadMsg(`${e.homeTeam?.name} vs ${e.awayTeam?.name}`, isCached);
          const [stats, pastLineup] = await Promise.all([
            statsCached
              ? Promise.resolve(statsCached)
              : fetchEventStatistics(e.id),
            lineupCached ? Promise.resolve(lineupCached) : fetchLineup(e.id),
          ]);
          const pastOpp = isHome ? e.awayTeam : e.homeTeam;
          const ppgPast = pastOpp ? ppgMap[pastOpp.id] : null;
          const factor = calcAdjustment(ppgActualOppHome, ppgPast, maxDiff);
          const lineupSim = calcLineupSim(currentHomeLineup, pastLineup, side);
          homeData.push({
            event: e,
            stats,
            pastOpp,
            ppgPast,
            factor,
            side,
            lineupSim,
            pastLineup,
          });
          if (!statsCached || !lineupCached) await delay(300);
        }

        const awayData = [];
        for (const e of awayFiltered) {
          const isAway = e.awayTeam?.id === awayTeamId;
          const side = isAway ? "away" : "home";
          const statsCached = await cacheGet(`stats_${e.id}`);
          const lineupCached = await cacheGet(`lineups_${e.id}`);
          const isCached = !!(statsCached && lineupCached);
          setLoadMsg(`${e.homeTeam?.name} vs ${e.awayTeam?.name}`, isCached);
          const [stats, pastLineup] = await Promise.all([
            statsCached
              ? Promise.resolve(statsCached)
              : fetchEventStatistics(e.id),
            lineupCached ? Promise.resolve(lineupCached) : fetchLineup(e.id),
          ]);
          const pastOpp = isAway ? e.homeTeam : e.awayTeam;
          const ppgPast = pastOpp ? ppgMap[pastOpp.id] : null;
          const factor = calcAdjustment(ppgActualOppAway, ppgPast, maxDiff);
          const lineupSim = calcLineupSim(currentAwayLineup, pastLineup, side);
          awayData.push({
            event: e,
            stats,
            pastOpp,
            ppgPast,
            factor,
            side,
            lineupSim,
            pastLineup,
          });
          if (!statsCached || !lineupCached) await delay(300);
        }



        // ── Ponderi per meci: doar recență, normalizat ──
        const RECENCY_W = [0.37, 0.24, 0.16, 0.11, 0.07, 0.05]; // index 0 = cel mai recent — raport ~7.5:1

        // Pondere suplimentară bazată pe semnificația rezultatului față de adversar — raport ~5:1
        const SIGNIFICANCE_W = {
          weaker:   { W: 0.50, D: 0.64, L: 0.82 },
          similar:  { W: 2.10, D: 2.10, L: 2.10 },
          stronger: { W: 1.27, D: 1.09, L: 0.60 },
        };
        const THRESHOLD_PCT = 0.20; // 20% din maxDiff pentru a distinge categorii

        const VENUE_W = { boost: 1.35, penalty: 0.74 }; // același teren → 1.35, teren diferit → 0.74 — raport 1.82:1

        function calcMatchWeights(dataArr, ppgActualOpp, preferredSide) {
          dataArr.forEach((d, i) => {
            const recency = RECENCY_W[i] ?? RECENCY_W[RECENCY_W.length - 1];
            // Determină rezultat
            const e = d.event;
            const hg = e.homeScore?.display ?? 0;
            const ag = e.awayScore?.display ?? 0;
            const result = d.side === 'home'
              ? (hg > ag ? 'W' : hg === ag ? 'D' : 'L')
              : (ag > hg ? 'W' : ag === hg ? 'D' : 'L');
            // Determină categorie adversar
            let category = 'similar';
            if (d.ppgPast != null && ppgActualOpp != null && maxDiff > 0) {
              const diff = d.ppgPast - ppgActualOpp;
              const threshold = maxDiff * THRESHOLD_PCT;
              if (diff < -threshold) category = 'weaker';
              else if (diff > threshold) category = 'stronger';
            }
            const sigMult  = SIGNIFICANCE_W[category]?.[result] ?? 1.0;
            const venueMult = d.side === preferredSide ? VENUE_W.boost : VENUE_W.penalty;
            d.weight      = recency * sigMult * venueMult;
            d.sigCategory = category;
            d.sigResult   = result;
            d.sigMult     = sigMult;
            d.venueMult   = venueMult;
          });
        }

        // ── H2H lambda cu ponderi recență (xG/xGA per repriză) ──
        const H2H_XG_BLEND = 0.70; // blend xG ↔ goluri reale pentru meciurile H2H
        const H2H_RECENCY_W = [0.50, 0.40, 0.05, 0.03, 0.02]; // sumă = 1.00
        function calcH2HLambdas(matches, statsArr, hTeamId) {
          if (!matches || matches.length === 0) return null;
          const H2H_VENUE_BOOST   = 1.30;
          const H2H_VENUE_PENALTY = 0.70;
          let wHome1H = 0, wHome2H = 0, wAway1H = 0, wAway2H = 0;
          let wHomePoss = 0, wAwayPoss = 0, wHomePoss1H = 0, wAwayPoss1H = 0, wHomePoss2H = 0, wAwayPoss2H = 0;
          let wHomeFouls1H = 0, wHomeFouls2H = 0, wAwayFouls1H = 0, wAwayFouls2H = 0;
          let wHomeYellows1H = 0, wHomeYellows2H = 0, wAwayYellows1H = 0, wAwayYellows2H = 0;
          let wTotal = 0;
          matches.forEach((e, i) => {
            const recencyW = H2H_RECENCY_W[i] ?? H2H_RECENCY_W[H2H_RECENCY_W.length - 1];
            const s = statsArr[i];
            const isHome = e.homeTeam?.id === hTeamId;
            const venueW = isHome ? H2H_VENUE_BOOST : H2H_VENUE_PENALTY;
            const w = recencyW * venueW;
            const mySide  = isHome ? "home" : "away";
            const oppSide = isHome ? "away" : "home";

            let myXG1H  = getValByPeriod(s, "expectedGoals", mySide,  "1ST") ?? 0;
            let myXG2H  = getValByPeriod(s, "expectedGoals", mySide,  "2ND") ?? 0;
            let oppXG1H = getValByPeriod(s, "expectedGoals", oppSide, "1ST") ?? 0;
            let oppXG2H = getValByPeriod(s, "expectedGoals", oppSide, "2ND") ?? 0;

            // Fallback: dacă nu există xG per repriză, îl împărțim proporțional cu suturi
            const myXG  = getVal(s, "expectedGoals", mySide)  ?? 0;
            const oppXG = getVal(s, "expectedGoals", oppSide) ?? 0;
            if (myXG1H === 0 && myXG2H === 0 && myXG > 0) {
              const s1 = getValByPeriod(s, "totalShotsOnGoal", mySide, "1ST") ?? 0;
              const s2 = getValByPeriod(s, "totalShotsOnGoal", mySide, "2ND") ?? 0;
              const r1 = (s1 + s2) > 0 ? s1 / (s1 + s2) : 0.47;
              myXG1H = myXG * r1; myXG2H = myXG * (1 - r1);
            }
            if (oppXG1H === 0 && oppXG2H === 0 && oppXG > 0) {
              const s1 = getValByPeriod(s, "totalShotsOnGoal", oppSide, "1ST") ?? 0;
              const s2 = getValByPeriod(s, "totalShotsOnGoal", oppSide, "2ND") ?? 0;
              const r1 = (s1 + s2) > 0 ? s1 / (s1 + s2) : 0.47;
              oppXG1H = oppXG * r1; oppXG2H = oppXG * (1 - r1);
            }

            // Goluri reale per repriză din eveniment (cu winsorization la total meci)
            const rawMyTotal  = isHome ? (e.homeScore?.display ?? 0) : (e.awayScore?.display ?? 0);
            const rawOppTotal = isHome ? (e.awayScore?.display ?? 0) : (e.homeScore?.display ?? 0);
            const H2H_GOALS_CAP = 4;
            const myCapScale  = rawMyTotal  > H2H_GOALS_CAP ? H2H_GOALS_CAP / rawMyTotal  : 1;
            const oppCapScale = rawOppTotal > H2H_GOALS_CAP ? H2H_GOALS_CAP / rawOppTotal : 1;
            const myGoals1H  = (isHome ? (e.homeScore?.period1 ?? 0) : (e.awayScore?.period1 ?? 0)) * myCapScale;
            const myGoals2H  = (isHome ? (e.homeScore?.period2 ?? 0) : (e.awayScore?.period2 ?? 0)) * myCapScale;
            const oppGoals1H = (isHome ? (e.awayScore?.period1 ?? 0) : (e.homeScore?.period1 ?? 0)) * oppCapScale;
            const oppGoals2H = (isHome ? (e.awayScore?.period2 ?? 0) : (e.homeScore?.period2 ?? 0)) * oppCapScale;

            // Blend xG ↔ goluri reale per repriză (H2H_XG_BLEND)
            const blendedMyXG1H  = myXG1H  * (1 - H2H_XG_BLEND) + myGoals1H  * H2H_XG_BLEND;
            const blendedMyXG2H  = myXG2H  * (1 - H2H_XG_BLEND) + myGoals2H  * H2H_XG_BLEND;
            const blendedOppXG1H = oppXG1H * (1 - H2H_XG_BLEND) + oppGoals1H * H2H_XG_BLEND;
            const blendedOppXG2H = oppXG2H * (1 - H2H_XG_BLEND) + oppGoals2H * H2H_XG_BLEND;

            // Dacă nu există deloc date pentru meciul ăsta, îl sărim
            if (blendedMyXG1H === 0 && blendedMyXG2H === 0 && blendedOppXG1H === 0 && blendedOppXG2H === 0) return;

            wHome1H += blendedMyXG1H  * w;
            wHome2H += blendedMyXG2H  * w;
            wAway1H += blendedOppXG1H * w;
            wAway2H += blendedOppXG2H * w;
            const myPoss    = getVal(s, "ballPossession", mySide)  ?? 50;
            const oppPoss   = getVal(s, "ballPossession", oppSide) ?? 50;
            const myPoss1H  = getValByPeriod(s, "ballPossession", mySide,  "1ST") ?? myPoss;
            const myPoss2H  = getValByPeriod(s, "ballPossession", mySide,  "2ND") ?? myPoss;
            const oppPoss1H = getValByPeriod(s, "ballPossession", oppSide, "1ST") ?? oppPoss;
            const oppPoss2H = getValByPeriod(s, "ballPossession", oppSide, "2ND") ?? oppPoss;
            wHomePoss   += myPoss    * w;
            wAwayPoss   += oppPoss   * w;
            wHomePoss1H += myPoss1H  * w;
            wAwayPoss1H += oppPoss1H * w;
            wHomePoss2H += myPoss2H  * w;
            wAwayPoss2H += oppPoss2H * w;

            const myFouls     = getVal(s, "fouls", mySide)  ?? 0;
            const oppFouls    = getVal(s, "fouls", oppSide) ?? 0;
            const myFouls1H   = getValByPeriod(s, "fouls", mySide,  "1ST") ?? myFouls  * 0.47;
            const myFouls2H   = getValByPeriod(s, "fouls", mySide,  "2ND") ?? myFouls  * 0.53;
            const oppFouls1H  = getValByPeriod(s, "fouls", oppSide, "1ST") ?? oppFouls * 0.47;
            const oppFouls2H  = getValByPeriod(s, "fouls", oppSide, "2ND") ?? oppFouls * 0.53;
            wHomeFouls1H += myFouls1H  * w;
            wHomeFouls2H += myFouls2H  * w;
            wAwayFouls1H += oppFouls1H * w;
            wAwayFouls2H += oppFouls2H * w;

            const myYellows    = getVal(s, "yellowCards", mySide)  ?? 0;
            const oppYellows   = getVal(s, "yellowCards", oppSide) ?? 0;
            const myYellows1H  = getValByPeriod(s, "yellowCards", mySide,  "1ST") ?? myYellows  * 0.47;
            const myYellows2H  = getValByPeriod(s, "yellowCards", mySide,  "2ND") ?? myYellows  * 0.53;
            const oppYellows1H = getValByPeriod(s, "yellowCards", oppSide, "1ST") ?? oppYellows * 0.47;
            const oppYellows2H = getValByPeriod(s, "yellowCards", oppSide, "2ND") ?? oppYellows * 0.53;
            wHomeYellows1H += myYellows1H  * w;
            wHomeYellows2H += myYellows2H  * w;
            wAwayYellows1H += oppYellows1H * w;
            wAwayYellows2H += oppYellows2H * w;

            wTotal  += w;
          });
          if (wTotal === 0) return null;
          return {
            home1H: wHome1H / wTotal,
            home2H: wHome2H / wTotal,
            away1H: wAway1H / wTotal,
            away2H: wAway2H / wTotal,
            homePoss:   wHomePoss   / wTotal,
            awayPoss:   wAwayPoss   / wTotal,
            homePoss1H: wHomePoss1H / wTotal,
            awayPoss1H: wAwayPoss1H / wTotal,
            homePoss2H: wHomePoss2H / wTotal,
            awayPoss2H: wAwayPoss2H / wTotal,
            homeFouls1H:  wHomeFouls1H  / wTotal,
            homeFouls2H:  wHomeFouls2H  / wTotal,
            awayFouls1H:  wAwayFouls1H  / wTotal,
            awayFouls2H:  wAwayFouls2H  / wTotal,
            homeYellows1H: wHomeYellows1H / wTotal,
            homeYellows2H: wHomeYellows2H / wTotal,
            awayYellows1H: wAwayYellows1H / wTotal,
            awayYellows2H: wAwayYellows2H / wTotal,
          };
        }

        calcMatchWeights(homeData, ppgActualOppHome, 'home');

        // Helper: bloc meci

        // ── Extrage cele 5 statistici ajustate cu boost/nerf ──
        function extractAdjusted(d) {
          const s = d.stats;
          const side = d.side;
          const oppSide = side === "home" ? "away" : "home";
          const possession   = getVal(s, "ballPossession", side) ?? 50;
          const possession1H = getValByPeriod(s, "ballPossession", side, "1ST") ?? possession;
          const possession2H = getValByPeriod(s, "ballPossession", side, "2ND") ?? possession;
          const xG   = getVal(s, "expectedGoals", side) ?? 0;
          const xGA  = getVal(s, "expectedGoals", oppSide) ?? 0;

          // xG per repriză: din API dacă există, altfel proporțional cu suturi pe poartă
          let xG1H  = getValByPeriod(s, "expectedGoals", side,    "1ST") ?? 0;
          let xG2H  = getValByPeriod(s, "expectedGoals", side,    "2ND") ?? 0;
          let xGA1H = getValByPeriod(s, "expectedGoals", oppSide, "1ST") ?? 0;
          let xGA2H = getValByPeriod(s, "expectedGoals", oppSide, "2ND") ?? 0;
          if (xG1H === 0 && xG2H === 0 && xG > 0) {
            const s1 = getValByPeriod(s, "totalShotsOnGoal", side, "1ST") ?? 0;
            const s2 = getValByPeriod(s, "totalShotsOnGoal", side, "2ND") ?? 0;
            const r1 = (s1 + s2) > 0 ? s1 / (s1 + s2) : 0.47;
            xG1H = xG * r1;  xG2H = xG * (1 - r1);
          }
          if (xGA1H === 0 && xGA2H === 0 && xGA > 0) {
            const s1 = getValByPeriod(s, "totalShotsOnGoal", oppSide, "1ST") ?? 0;
            const s2 = getValByPeriod(s, "totalShotsOnGoal", oppSide, "2ND") ?? 0;
            const r1 = (s1 + s2) > 0 ? s1 / (s1 + s2) : 0.47;
            xGA1H = xGA * r1;  xGA2H = xGA * (1 - r1);
          }

          const ev = d.event;
          const rawScored =
            side === "home"
              ? (ev.homeScore?.display ?? 0)
              : (ev.awayScore?.display ?? 0);
          const rawConceded =
            side === "home"
              ? (ev.awayScore?.display ?? 0)
              : (ev.homeScore?.display ?? 0);

          // Winsorization: cap goluri per meci la max 4 (outlier-ii 5-0, 6-0 nu mai distorsionează media)
          const GOALS_CAP = 4;
          const goalsScored   = Math.min(rawScored,   GOALS_CAP);
          const goalsConceded = Math.min(rawConceded, GOALS_CAP);
          const scoredScale   = rawScored   > 0 ? goalsScored   / rawScored   : 1;
          const concededScale = rawConceded > 0 ? goalsConceded / rawConceded : 1;

          const goalsScored1H   = (side === "home" ? (ev.homeScore?.period1 ?? 0) : (ev.awayScore?.period1 ?? 0)) * scoredScale;
          const goalsScored2H   = (side === "home" ? (ev.homeScore?.period2 ?? 0) : (ev.awayScore?.period2 ?? 0)) * scoredScale;
          const goalsConceded1H = (side === "home" ? (ev.awayScore?.period1 ?? 0) : (ev.homeScore?.period1 ?? 0)) * concededScale;
          const goalsConceded2H = (side === "home" ? (ev.awayScore?.period2 ?? 0) : (ev.homeScore?.period2 ?? 0)) * concededScale;

          const fouls = getVal(s, "fouls", side) ?? 0;
          const fouls1H = getValByPeriod(s, "fouls", side, "1ST") ?? fouls * 0.47;
          const fouls2H = getValByPeriod(s, "fouls", side, "2ND") ?? fouls * 0.53;
          const yellowCards = getVal(s, "yellowCards", side) ?? 0;
          const yellowCards1H = getValByPeriod(s, "yellowCards", side, "1ST") ?? yellowCards * 0.47;
          const yellowCards2H = getValByPeriod(s, "yellowCards", side, "2ND") ?? yellowCards * 0.53;

          return { possession, possession1H, possession2H, xG, xGA, xG1H, xG2H, xGA1H, xGA2H, goalsScored, goalsConceded, goalsScored1H, goalsScored2H, goalsConceded1H, goalsConceded2H, fouls, fouls1H, fouls2H, yellowCards, yellowCards1H, yellowCards2H };
        }

        // Afișare verificare statistici ajustate + similaritate lineup + pondere
        function adjStatsHtml(d) {

        // ── Similaritate combinată (câți din lineup-ul curent au jucat în cel puțin 1 din 5 meciuri) ──
        function calcCombinedSim(currentIds, dataArr) {

        // ── Ajustare xG pe baza diferenței față de media ponderată a golurilor ──
        function wAvg(dataArr, key) {
          const withStats = dataArr.filter((d) => d.stats);
          if (!withStats.length) return 0;
          const totalW = withStats.reduce((s, d) => s + (d.weight ?? 0), 0);
          if (totalW === 0) {

          }
          return (
            withStats.reduce(
              (s, d) => s + extractAdjusted(d)[key] * (d.weight ?? 0),
              0,
            ) / totalW

        }

        const homeAvgPos    = wAvg(homeData, "possession");
        const homeAvgPos1H  = wAvg(homeData, "possession1H");
        const homeAvgPos2H  = wAvg(homeData, "possession2H");

        const homeAvgConceded = wAvg(homeData, "goalsConceded");
        const homeXGAFinal = homeAvgXGA * (1 - BLEND) + homeAvgConceded * BLEND;

        const awayAvgXGA = wAvg(awayData, "xGA");
        const awayAvgConceded = wAvg(awayData, "goalsConceded");
        const awayXGAFinal = awayAvgXGA * (1 - BLEND) + awayAvgConceded * BLEND;


        document.getElementById("simVerifySection").insertAdjacentHTML(

        // ── Fatigue ──
        const homeFatigue = calcFatigue(homeEvents, event.startTimestamp);
        const awayFatigue = calcFatigue(awayEvents, event.startTimestamp);
        const { homeMult: homeFatigueMult, awayMult: awayFatigueMult } =
          calcRelativeFatigueMult(homeFatigue.avgRest, awayFatigue.avgRest);

        // ── Continuitate lineup ──
        const homeContinuity = calcLineupContinuity(homeData);
        const awayContinuity = calcLineupContinuity(awayData);
        const { homeMult: homeContMult, awayMult: awayContMult } =
          calcRelativeContinuityMult(homeContinuity, awayContinuity);

        // Combinat aditiv: fatigue + continuitate
        const homeTotalMult = 1 + (homeFatigueMult - 1) + (homeContMult - 1);
        const awayTotalMult = 1 + (awayFatigueMult - 1) + (awayContMult - 1);

        const contLabel = (cont, mult) => {
          const pct = Math.round((mult - 1) * 100);
          const sign = pct >= 0 ? '+' : '';
          const cls = pct > 0 ? 'sim-boost-text' : pct < 0 ? 'sim-nerf-text' : '';
          const effect = pct !== 0 ? ` → <span class="${cls}">${sign}${pct}%</span>` : ` → <span>⚖️ Neutru</span>`;
          return `Continuitate lineup: <b>${cont.toFixed(1)}%</b>${effect}`;
        };

        document.getElementById("simVerifySection").insertAdjacentHTML("beforeend", `
          <div class="sim-xg-summary">
            <div class="sim-xg-summary-title">Continuitate echipă de start</div>
            <div class="sim-xg-row">
              <img src="${homeLogoUrl}" onerror="this.src=''" alt="">
              <span>${event.homeTeam?.name}</span>
              <span>${contLabel(homeContinuity, homeContMult)}</span>
            </div>
            <div class="sim-xg-row">
              <img src="${awayLogoUrl}" onerror="this.src=''" alt="">
              <span>${event.awayTeam?.name}</span>
              <span>${contLabel(awayContinuity, awayContMult)}</span>
            </div>
          </div>`);

        const fatigueLabel = (f, mult) => {
          const pct = Math.round((mult - 1) * 100);
          const sign = pct >= 0 ? '+' : '';
          const cls = pct > 0 ? 'sim-boost-text' : pct < 0 ? 'sim-nerf-text' : '';
          const effect = pct !== 0 ? ` → <span class="${cls}">${sign}${pct}%</span>` : ` → <span>⚖️ Neutru</span>`;
          return `Medie odihnă între ultimele ${f.matchCount} meciuri: <b>${f.avgRest} zile</b>${effect}`;
        };

        document.getElementById("simVerifySection").insertAdjacentHTML("beforeend", `
          <div class="sim-xg-summary">
            <div class="sim-xg-summary-title">Oboseală (toate competițiile)</div>
            <div class="sim-xg-row">
              <img src="${homeLogoUrl}" onerror="this.src=''" alt="">
              <span>${event.homeTeam?.name}</span>
              <span>${fatigueLabel(homeFatigue, homeFatigueMult)}</span>
            </div>
            <div class="sim-xg-row">
              <img src="${awayLogoUrl}" onerror="this.src=''" alt="">
              <span>${event.awayTeam?.name}</span>
              <span>${fatigueLabel(awayFatigue, awayFatigueMult)}</span>
            </div>
          </div>`);

        // ── Lambda per repriză: blend direct xG1H/2H ↔ goluri reale 1H/2H ──
        const homeAvgXG1H  = wAvg(homeData, "xG1H")  || homeAvgXG  * 0.5;
        const homeAvgXG2H  = wAvg(homeData, "xG2H")  || homeAvgXG  * 0.5;
        const homeAvgXGA1H = wAvg(homeData, "xGA1H") || homeAvgXGA * 0.5;
        const homeAvgXGA2H = wAvg(homeData, "xGA2H") || homeAvgXGA * 0.5;
        const awayAvgXG1H  = wAvg(awayData, "xG1H")  || awayAvgXG  * 0.5;
        const awayAvgXG2H  = wAvg(awayData, "xG2H")  || awayAvgXG  * 0.5;
        const awayAvgXGA1H = wAvg(awayData, "xGA1H") || awayAvgXGA * 0.5;
        const awayAvgXGA2H = wAvg(awayData, "xGA2H") || awayAvgXGA * 0.5;

        const homeAvgGoals1H    = wAvg(homeData, "goalsScored1H")   || homeAvgGoals  * 0.5;
        const homeAvgGoals2H    = wAvg(homeData, "goalsScored2H")   || homeAvgGoals  * 0.5;
        const homeAvgConceded1H = wAvg(homeData, "goalsConceded1H") || homeAvgConceded * 0.5;
        const homeAvgConceded2H = wAvg(homeData, "goalsConceded2H") || homeAvgConceded * 0.5;
        const awayAvgGoals1H    = wAvg(awayData, "goalsScored1H")   || awayAvgGoals  * 0.5;
        const awayAvgGoals2H    = wAvg(awayData, "goalsScored2H")   || awayAvgGoals  * 0.5;
        const awayAvgConceded1H = wAvg(awayData, "goalsConceded1H") || awayAvgConceded * 0.5;
        const awayAvgConceded2H = wAvg(awayData, "goalsConceded2H") || awayAvgConceded * 0.5;

        // Blend direct per repriză (xG ↔ goluri reale 50/50) + fatigue/continuitate
        const hXG1H  = (homeAvgXG1H  * (1 - BLEND) + homeAvgGoals1H    * BLEND) * homeTotalMult;
        const hXG2H  = (homeAvgXG2H  * (1 - BLEND) + homeAvgGoals2H    * BLEND) * homeTotalMult;
        const hXGA1H = (homeAvgXGA1H * (1 - BLEND) + homeAvgConceded1H * BLEND) * (2 - homeTotalMult);
        const hXGA2H = (homeAvgXGA2H * (1 - BLEND) + homeAvgConceded2H * BLEND) * (2 - homeTotalMult);
        const aXG1H  = (awayAvgXG1H  * (1 - BLEND) + awayAvgGoals1H    * BLEND) * awayTotalMult;
        const aXG2H  = (awayAvgXG2H  * (1 - BLEND) + awayAvgGoals2H    * BLEND) * awayTotalMult;
        const aXGA1H = (awayAvgXGA1H * (1 - BLEND) + awayAvgConceded1H * BLEND) * (2 - awayTotalMult);
        const aXGA2H = (awayAvgXGA2H * (1 - BLEND) + awayAvgConceded2H * BLEND) * (2 - awayTotalMult);

        const lambdaHome1HRaw = hXG1H * 0.60 + aXGA1H * 0.40;
        const lambdaHome2HRaw = hXG2H * 0.60 + aXGA2H * 0.40;
        const lambdaAway1HRaw = aXG1H * 0.60 + hXGA1H * 0.40;
        const lambdaAway2HRaw = aXG2H * 0.60 + hXGA2H * 0.40;

        const h2hL = calcH2HLambdas(h2hMatches, h2hStats, homeTeamId);

        const homeAvgPosFinal   = h2hL ? homeAvgPos   * 0.60 + h2hL.homePoss   * 0.40 : homeAvgPos;
        const awayAvgPosFinal   = h2hL ? awayAvgPos   * 0.60 + h2hL.awayPoss   * 0.40 : awayAvgPos;
        const homeAvgPosFinal1H = h2hL ? homeAvgPos1H * 0.60 + h2hL.homePoss1H * 0.40 : homeAvgPos1H;
        const awayAvgPosFinal1H = h2hL ? awayAvgPos1H * 0.60 + h2hL.awayPoss1H * 0.40 : awayAvgPos1H;
        const homeAvgPosFinal2H = h2hL ? homeAvgPos2H * 0.60 + h2hL.homePoss2H * 0.40 : homeAvgPos2H;
        const awayAvgPosFinal2H = h2hL ? awayAvgPos2H * 0.60 + h2hL.awayPoss2H * 0.40 : awayAvgPos2H;
        const H2H_BLEND = 0.60;
        const h2hHomeLambda1H = h2hL ? h2hL.home1H * 0.60 + h2hL.away1H * 0.40 : null;
        const h2hHomeLambda2H = h2hL ? h2hL.home2H * 0.60 + h2hL.away2H * 0.40 : null;
        const h2hAwayLambda1H = h2hL ? h2hL.away1H * 0.60 + h2hL.home1H * 0.40 : null;
        const h2hAwayLambda2H = h2hL ? h2hL.away2H * 0.60 + h2hL.home2H * 0.40 : null;
        const lambdaHome1HFinal = h2hL ? lambdaHome1HRaw * (1 - H2H_BLEND) + h2hHomeLambda1H * H2H_BLEND : lambdaHome1HRaw;
        const lambdaHome2HFinal = h2hL ? lambdaHome2HRaw * (1 - H2H_BLEND) + h2hHomeLambda2H * H2H_BLEND : lambdaHome2HRaw;
        const lambdaAway1HFinal = h2hL ? lambdaAway1HRaw * (1 - H2H_BLEND) + h2hAwayLambda1H * H2H_BLEND : lambdaAway1HRaw;
        const lambdaAway2HFinal = h2hL ? lambdaAway2HRaw * (1 - H2H_BLEND) + h2hAwayLambda2H * H2H_BLEND : lambdaAway2HRaw;

        // ── Simulare Monte Carlo ──
        const leagueTotalGoals = standingsRows.reduce((s, r) => s + (r.scoresFor ?? 0), 0);
        const leagueTotalMatches = standingsRows.reduce((s, r) => s + (r.matches ?? 0), 0) / 2;
        const leagueAvg = leagueTotalMatches > 0 ? leagueTotalGoals / leagueTotalMatches : 0;

        // Media golurilor totale din forma recentă a celor două echipe
        const homeFormTotalGoals = wAvg(homeData, "goalsScored") + wAvg(homeData, "goalsConceded");
        const awayFormTotalGoals = wAvg(awayData, "goalsScored") + wAvg(awayData, "goalsConceded");
        const teamFormAvg = (homeFormTotalGoals + awayFormTotalGoals) / 2;

        // Media faulturi și cartonașe galbene per repriză (forma recentă)
        const homeAvgFouls   = wAvg(homeData, "fouls");
        const homeAvgFouls1H = wAvg(homeData, "fouls1H") || homeAvgFouls * 0.47;
        const homeAvgFouls2H = wAvg(homeData, "fouls2H") || homeAvgFouls * 0.53;
        const awayAvgFouls   = wAvg(awayData, "fouls");
        const awayAvgFouls1H = wAvg(awayData, "fouls1H") || awayAvgFouls * 0.47;
        const awayAvgFouls2H = wAvg(awayData, "fouls2H") || awayAvgFouls * 0.53;
        const homeAvgYellows   = wAvg(homeData, "yellowCards");
        const homeAvgYellows1H = wAvg(homeData, "yellowCards1H") || homeAvgYellows * 0.47;
        const homeAvgYellows2H = wAvg(homeData, "yellowCards2H") || homeAvgYellows * 0.53;
        const awayAvgYellows   = wAvg(awayData, "yellowCards");
        const awayAvgYellows1H = wAvg(awayData, "yellowCards1H") || awayAvgYellows * 0.47;
        const awayAvgYellows2H = wAvg(awayData, "yellowCards2H") || awayAvgYellows * 0.53;

        // Faulturi/cartonașe: 60% formă recentă + 40% H2H
        const H2H_FOULS_BLEND = 0.40;
        const homeAvgFouls1HFinal = h2hL?.homeFouls1H  ? homeAvgFouls1H   * (1 - H2H_FOULS_BLEND) + h2hL.homeFouls1H  * H2H_FOULS_BLEND : homeAvgFouls1H;
        const homeAvgFouls2HFinal = h2hL?.homeFouls2H  ? homeAvgFouls2H   * (1 - H2H_FOULS_BLEND) + h2hL.homeFouls2H  * H2H_FOULS_BLEND : homeAvgFouls2H;
        const awayAvgFouls1HFinal = h2hL?.awayFouls1H  ? awayAvgFouls1H   * (1 - H2H_FOULS_BLEND) + h2hL.awayFouls1H  * H2H_FOULS_BLEND : awayAvgFouls1H;
        const awayAvgFouls2HFinal = h2hL?.awayFouls2H  ? awayAvgFouls2H   * (1 - H2H_FOULS_BLEND) + h2hL.awayFouls2H  * H2H_FOULS_BLEND : awayAvgFouls2H;
        const homeAvgYellows1HFinal = h2hL?.homeYellows1H ? homeAvgYellows1H * (1 - H2H_FOULS_BLEND) + h2hL.homeYellows1H * H2H_FOULS_BLEND : homeAvgYellows1H;
        const homeAvgYellows2HFinal = h2hL?.homeYellows2H ? homeAvgYellows2H * (1 - H2H_FOULS_BLEND) + h2hL.homeYellows2H * H2H_FOULS_BLEND : homeAvgYellows2H;
        const awayAvgYellows1HFinal = h2hL?.awayYellows1H ? awayAvgYellows1H * (1 - H2H_FOULS_BLEND) + h2hL.awayYellows1H * H2H_FOULS_BLEND : awayAvgYellows1H;
        const awayAvgYellows2HFinal = h2hL?.awayYellows2H ? awayAvgYellows2H * (1 - H2H_FOULS_BLEND) + h2hL.awayYellows2H * H2H_FOULS_BLEND : awayAvgYellows2H;

        // Media golurilor totale din H2H (recency weighted)
        let h2hGoalsW = 0, h2hTotalW = 0;
        h2hMatches.forEach((e, i) => {
          const w = H2H_RECENCY_W[i] ?? H2H_RECENCY_W[H2H_RECENCY_W.length - 1];
          const total = (e.homeScore?.display ?? 0) + (e.awayScore?.display ?? 0);
          h2hGoalsW += total * w;
          h2hTotalW += w;
        });
        const h2hAvgGoals = h2hTotalW > 0 ? h2hGoalsW / h2hTotalW : null;

        // Calibration lambda: blend ligă 20% + H2H 40% + formă recentă 40%
        const calibrationLambda = h2hAvgGoals != null
          ? leagueAvg * 0.20 + h2hAvgGoals * 0.40 + teamFormAvg * 0.40
          : leagueAvg * 0.30 + teamFormAvg * 0.70;

        const simResultsSection = document.getElementById("simResultsSection");
        simResultsSection.innerHTML = `<div class="sim-results-loading"><div class="spinner"></div><span>Se rulează simularea (100.000 meciuri)...</span></div>`;

        const r = await runMonteCarlo(
          lambdaHome1HFinal,
          lambdaHome2HFinal,
          lambdaAway1HFinal,
          lambdaAway2HFinal,
          homeAvgPosFinal1H,
          awayAvgPosFinal1H,
          homeAvgPosFinal2H,
          awayAvgPosFinal2H,
          calibrationLambda,
          homeScoredW,
          homeConcededW,
          awayScoredW,
          awayConcededW,
          // Faulturi/galbene: rate per minut de posesie adversă (echipa faultează doar când apără)
          // home faultează când away are bila → fracție timp away = 1 - homePosBase
          // away faultează când home are bila → fracție timp home = homePosBase
          ...((() => {
            const hb1 = (homeAvgPosFinal1H + awayAvgPosFinal1H) > 0 ? homeAvgPosFinal1H / (homeAvgPosFinal1H + awayAvgPosFinal1H) : 0.5;
            const hb2 = (homeAvgPosFinal2H + awayAvgPosFinal2H) > 0 ? homeAvgPosFinal2H / (homeAvgPosFinal2H + awayAvgPosFinal2H) : 0.5;
            return [
              homeAvgFouls1HFinal   / (45 * Math.max(0.1, 1 - hb1)),
              homeAvgFouls2HFinal   / (45 * Math.max(0.1, 1 - hb2)),
              awayAvgFouls1HFinal   / (45 * Math.max(0.1, hb1)),
              awayAvgFouls2HFinal   / (45 * Math.max(0.1, hb2)),
              homeAvgYellows1HFinal / (45 * Math.max(0.1, 1 - hb1)),
              homeAvgYellows2HFinal / (45 * Math.max(0.1, 1 - hb2)),
              awayAvgYellows1HFinal / (45 * Math.max(0.1, hb1)),
              awayAvgYellows2HFinal / (45 * Math.max(0.1, hb2)),
            ];
          })()),
        );
        simResultsSection.innerHTML = renderSimResults(
          r,
          event.homeTeam?.name,
          event.awayTeam?.name,
          homeLogoUrl,
          awayLogoUrl,
          lambdaHome1HFinal,
          lambdaHome2HFinal,
          lambdaAway1HFinal,
          lambdaAway2HFinal,
          leagueAvg,
          homeScoredW,
          homeConcededW,
          awayScoredW,
          awayConcededW,
          homeGoalDist,
          awayGoalDist,
        );
      }

      // ── STAT EXTRACTION ────────────────────────────────────────────────────────
      function getStatItem(statistics, key) {
        if (!statistics) return null;
        const allPeriod = statistics.find((s) => s.period === "ALL");
        if (!allPeriod) return null;
        for (const g of allPeriod.groups) {
          const item = g.statisticsItems.find((i) => i.key === key);
          if (item) return item;
        }
        return null;
      }

      function getValByPeriod(stats, key, side, period) {
        if (!stats) return null;
        const p = stats.find((s) => s.period === period);
        if (!p) return null;
        for (const g of p.groups) {
          const item = g.statisticsItems.find((i) => i.key === key);
          if (item) return side === "home" ? item.homeValue : item.awayValue;
        }
        return null;
      }

      function getVal(stats, key, side) {
        const item = getStatItem(stats, key);
        if (!item) return null;
        return side === "home" ? item.homeValue : item.awayValue;
      }

      function getRate(stats, key, side) {
        const item = getStatItem(stats, key);
        if (!item) return null;
        const v = side === "home" ? item.homeValue : item.awayValue;
        const t = side === "home" ? item.homeTotal : item.awayTotal;
        return t != null && t > 0 ? v / t : null;
      }

      function switchTab(tab) {
        document
          .querySelectorAll(".match-tab")
          .forEach((t) => t.classList.remove("active"));
        document
          .querySelector(`.match-tab[onclick*="${tab}"]`)
          .classList.add("active");
        document.getElementById("tabAnalysis").style.display =
          tab === "analysis" ? "" : "none";
        document.getElementById("tabSimulation").style.display =
          tab === "simulation" ? "" : "none";
        if (tab === "simulation") loadSimulation();
      }

      (async () => {
        event = await cacheGet("match_current");
        renderHero();
        loadLineups();
        loadForm();
      })();
    </script>
  </body>
</html>
